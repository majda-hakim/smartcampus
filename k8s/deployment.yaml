
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcampus
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartcampus
  template:
    metadata:
      labels:
        app: smartcampus
    spec:
      containers:
        - name: smartcampus
          image: smartcampus:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: smartcampus-config
            - secretRef:
                name: smartcampus-secret
